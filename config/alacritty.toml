# Alacritty Terminal Configuration
# GPU-accelerated terminal, shared by Linux, macOS and Windows.
# Clipboard, font-size and search keys use Alacritty's built-in defaults
# (Ctrl+Shift+C/V, Ctrl+=/-/0, Ctrl+Shift+F on Linux and Windows; Cmd on macOS).

[general]
# Machine-specific overrides (font size on a HiDPI screen, opacity, ...) go in
# local.toml next to this file. It is optional and not tracked in dotfiles.
import = ["~/.config/alacritty/local.toml"]
live_config_reload = true

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 10, y = 10 }
# Spread leftover pixels evenly instead of leaving a gap at the bottom/right.
dynamic_padding = true
decorations = "full"
opacity = 0.95
# macOS: make Option act as Alt so zsh/tmux/nvim Alt bindings work.
option_as_alt = "Both"

[scrolling]
history = 50000
multiplier = 3

[font]
# MesloLGS NF is the Powerlevel10k font installed by scripts/setup-terminal.sh.
normal = { family = "MesloLGS NF", style = "Regular" }
bold = { family = "MesloLGS NF", style = "Bold" }
italic = { family = "MesloLGS NF", style = "Italic" }
bold_italic = { family = "MesloLGS NF", style = "Bold Italic" }
size = 18.0
builtin_box_drawing = true

[selection]
# Copy on select, like most Linux terminals.
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 750
unfocused_hollow = true

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration = 0

[keyboard]
bindings = [
    # Shift+Enter inserts a newline in Claude Code, Pi and other TUIs instead of submitting.
    { key = "Enter", mods = "Shift", chars = "\u001b\r" },
    # New window in the current directory.
    { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
    # Clear scrollback.
    { key = "K", mods = "Control|Shift", action = "ClearHistory" },
]

[env]
# Widely known TERM so SSH sessions to hosts without alacritty terminfo still work.
TERM = "xterm-256color"

# Catppuccin Mocha (https://github.com/catppuccin/alacritty)
[colors.primary]
background = "#1E1E2E"
foreground = "#CDD6F4"
dim_foreground = "#7F849C"
bright_foreground = "#CDD6F4"

[colors.cursor]
text = "#1E1E2E"
cursor = "#F5E0DC"

[colors.vi_mode_cursor]
text = "#1E1E2E"
